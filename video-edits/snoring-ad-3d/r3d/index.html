<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./lib/build/three.module.js","three/addons/":"./lib/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { TTFLoader } from 'three/addons/loaders/TTFLoader.js';
import { Font } from 'three/addons/loaders/FontLoader.js';
import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { SCENES } from './scenes.js';

const W = 1080, H = 1920;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.toneMapping = THREE.NoToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.localClippingEnabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
const envTex = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture; envTex.colorSpace = THREE.SRGBColorSpace;

const fonts = {};
async function loadFont(name, url) {
  const json = await new Promise((res, rej) => new TTFLoader().load(url, res, undefined, rej));
  fonts[name] = new Font(json);
}
await loadFont('black', './lib/mont.woff');
await loadFont('xbold', './lib/mont9.woff');

// palette shared by all scenes
const PAL = {
  bgTop: '#f6f1ea', bgBot: '#e3d8c9', ink: '#1d1b1a', yellow: '#ffe600',
  cream: '#f4ece0', red: '#ff3b30', green: '#2fd27a', blue: '#4aa8ff', grey: '#8c8378'
};

function gradientTexture(top, bot, vignette = true) {
  const c = document.createElement('canvas'); c.width = 270; c.height = 480;
  const g = c.getContext('2d');
  const lg = g.createLinearGradient(0, 0, 0, 480); lg.addColorStop(0, top); lg.addColorStop(1, bot);
  g.fillStyle = lg; g.fillRect(0, 0, 270, 480);
  if (vignette) {
    const rg = g.createRadialGradient(135, 200, 60, 135, 220, 330);
    rg.addColorStop(0, 'rgba(255,255,255,0.35)'); rg.addColorStop(1, 'rgba(0,0,0,0.18)');
    g.fillStyle = rg; g.fillRect(0, 0, 270, 480);
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}

// helpers exposed to scenes
const H3 = {
  THREE, fonts, PAL, envTex, TextGeometry, RoundedBoxGeometry, gradientTexture,
  text(str, { size = 1, depth = 0.35, font = 'black', bevel = 0.04, curve = 6, maxW = 6.2 } = {}) {
    const g = new TextGeometry(str, { font: fonts[font], size, height: depth, curveSegments: curve,
      bevelEnabled: bevel > 0, bevelThickness: bevel, bevelSize: bevel * 0.8, bevelSegments: 3 });
    g.computeBoundingBox(); const b = g.boundingBox;
    g.translate(-(b.max.x + b.min.x) / 2, -(b.max.y + b.min.y) / 2, -(b.max.z + b.min.z) / 2);
    const w = b.max.x - b.min.x; if (w > maxW) { const k = maxW / w; g.scale(k, k, 1); }
    return g;
  },
  mat(color, o = {}) { return new THREE.MeshPhysicalMaterial({ color, roughness: 0.35, metalness: 0.0, clearcoat: 0.6, clearcoatRoughness: 0.25, envMapIntensity: 1.0, ...o }); },
  // easing
  clamp: (x, a = 0, b = 1) => Math.min(b, Math.max(a, x)),
  easeOutBack(x, s = 1.70158) { x = Math.min(1, Math.max(0, x)); const c3 = s + 1; return 1 + c3 * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2); },
  easeOutCubic(x) { x = Math.min(1, Math.max(0, x)); return 1 - Math.pow(1 - x, 3); },
  easeInOut(x) { x = Math.min(1, Math.max(0, x)); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; },
  spring(x, f = 4.5, d = 5) { x = Math.max(0, x); return 1 - Math.exp(-d * x) * Math.cos(f * Math.PI * x); },
  seg(t, a, b) { return Math.min(1, Math.max(0, (t - a) / (b - a))); },
  rand(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; },
};

let current = null;
window.setupScene = async (name, params = {}) => {
  const scene = new THREE.Scene();
  scene.environment = envTex;
  scene.background = gradientTexture(params.bgTop || PAL.bgTop, params.bgBot || PAL.bgBot);
  // camera: content kept in the central 4:5 safe area (y in [285,1635] of 1920)
  const camera = new THREE.PerspectiveCamera(32, W / H, 0.1, 200);
  camera.position.set(0, 0, 22);
  const key = new THREE.DirectionalLight(0xffffff, 1.6); key.position.set(5, 9, 10); key.castShadow = true;
  key.shadow.mapSize.set(1024, 1024); key.shadow.camera.left = -10; key.shadow.camera.right = 10; key.shadow.camera.top = 10; key.shadow.camera.bottom = -10; key.shadow.radius = 6;
  scene.add(key, new THREE.AmbientLight(0xffffff, 0.15));
  const rim = new THREE.DirectionalLight(0xfff2d8, 1.2); rim.position.set(-8, 4, -6); scene.add(rim);
  const ctx = { scene, camera, params, H: H3, key };
  const s = SCENES[name](ctx);
  current = { scene, camera, s, ctx };
  return true;
};
window.renderAt = (t) => {
  const { scene, camera, s } = current;
  // default subtle camera drift for depth
  camera.position.x = Math.sin(t * 0.6) * 0.6; camera.position.y = 0.3 + Math.cos(t * 0.5) * 0.3;
  camera.lookAt(0, 0, 0);
  s.update(t);
  renderer.render(scene, camera);
  return true;
};
window.grab = (q = 0.92) => renderer.domElement.toDataURL('image/jpeg', q);
window.READY = true;
</script>
</body></html>
